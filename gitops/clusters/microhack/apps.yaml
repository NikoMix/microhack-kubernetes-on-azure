---
# Stage 3: the polyglot workloads (dev overlay). Promote to prod by pointing a second
# Kustomization at ./gitops/apps/prod.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m0s
  retryInterval: 2m0s
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/apps/dev
  prune: true
  wait: true

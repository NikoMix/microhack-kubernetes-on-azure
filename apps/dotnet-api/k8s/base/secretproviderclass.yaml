# Azure Key Vault provider for the Secrets Store CSI Driver.
# Placeholder values (keyvaultName / tenantId / clientID) are replaced by the
# gitops/infra layer. Secrets are projected into a Kubernetes Secret via
# `secretObjects` and consumed by the Deployment through `envFrom.secretRef`.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dotnet-api-kv
  labels:
    app.kubernetes.io/name: dotnet-api
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: api
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Azure Workload Identity client id (federated to the ServiceAccount).
    clientID: "REPLACE_DOTNET_API_CLIENT_ID"
    keyvaultName: "REPLACE_KEYVAULT_NAME"
    tenantId: "REPLACE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: applicationinsights-connection-string
          objectType: secret
        - |
          objectName: ai-api-key
          objectType: secret
  secretObjects:
    - secretName: dotnet-api-secrets
      type: Opaque
      data:
        - objectName: applicationinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: ai-api-key
          key: AI__ApiKey

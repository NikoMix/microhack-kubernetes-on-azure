# SecretProviderClass projecting the Application Insights connection string from
# Azure Key Vault via the Secrets Store CSI driver. Included for parity with the
# rest of the MicroHack apps. Replace the placeholder values for your tenant /
# Key Vault. The Deployment does not mount this by default — enable it in an
# overlay if you want the connection string surfaced as APPLICATIONINSIGHTS_CONNECTION_STRING.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: node-web-secrets
  labels:
    app.kubernetes.io/name: node-web
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: web
spec:
  provider: azure
  parameters:
    usePodIdentity: 'false'
    clientID: 'REPLACE_NODE_WEB_CLIENT_ID'
    keyvaultName: 'REPLACE_KEYVAULT_NAME'
    tenantId: 'REPLACE_TENANT_ID'
    objects: |
      array:
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
    - secretName: node-web-appinsights
      type: Opaque
      data:
        - objectName: appinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING

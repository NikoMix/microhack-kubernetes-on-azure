apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-web
  labels:
    app.kubernetes.io/name: node-web
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

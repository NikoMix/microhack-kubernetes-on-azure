apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-web
  labels:
    app.kubernetes.io/name: node-web
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - microhack.example.com
      secretName: node-web-tls
  rules:
    - host: microhack.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-web
                port:
                  number: 80

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-worker"
version = "0.1.0"
description = "Async FastAPI worker that processes Pending orders for the MicroHack."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "MicroHack" }]
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "PL", "RUF", "S"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"src/python_worker/telemetry.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "azure.monitor.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["src"]

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microhack-apps

resources:
  - ../../base

images:
  - name: python-worker
    newTag: dev

replicas:
  - name: python-worker
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: python-worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: ConfigMap
      name: python-worker-config
    patch: |-
      - op: add
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://opentelemetry-collector.observability:4317"

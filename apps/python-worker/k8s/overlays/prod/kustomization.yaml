apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microhack-apps

resources:
  - ../../base

images:
  - name: python-worker
    newTag: stable

replicas:
  - name: python-worker
    count: 2

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: python-worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: ConfigMap
      name: python-worker-config
    patch: |-
      - op: add
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://opentelemetry-collector.observability:4317"

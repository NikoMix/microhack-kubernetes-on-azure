apiVersion: v1
kind: ConfigMap
metadata:
  name: python-worker-config
  labels:
    app.kubernetes.io/name: python-worker
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: worker
data:
  ORDERS_API_BASEURL: "http://dotnet-api:8080"
  WORKER_POLL_INTERVAL_SECONDS: "5"
  OTEL_SERVICE_NAME: "python-worker"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  LOG_LEVEL: "INFO"

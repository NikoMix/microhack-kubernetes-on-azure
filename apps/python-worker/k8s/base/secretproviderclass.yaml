apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: python-worker-kv
  labels:
    app.kubernetes.io/name: python-worker
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: worker
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_PYTHON_WORKER_CLIENT_ID"
    keyvaultName: "REPLACE_KEYVAULT_NAME"
    tenantId: "REPLACE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: applicationinsights-connection-string
          objectType: secret
  secretObjects:
    - secretName: python-worker-appinsights
      type: Opaque
      data:
        - objectName: applicationinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING

apiVersion: v1
kind: Service
metadata:
  name: python-worker
  labels:
    app.kubernetes.io/name: python-worker
    app.kubernetes.io/part-of: microhack-orders
    app.kubernetes.io/component: worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: python-worker
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

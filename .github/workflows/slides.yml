name: slides

on:
  push:
    branches: [main, nikomix-module-b-ttt-training]
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  pull_request:
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slides-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marp:
    name: marp export
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Export slides to HTML
        id: html
        run: |
          set -euo pipefail
          if [ ! -d slides ]; then
            echo "slides/ not present yet — skipping."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(find slides -type f -name '*.md' | wc -l)"
          if [ "${count}" -eq 0 ]; then
            echo "No slide decks found — skipping."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p slides-dist
          npx --yes @marp-team/marp-cli@4.4.0 --input-dir slides --output slides-dist --html --allow-local-files
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Export slides to PDF (best-effort)
        if: steps.html.outputs.built == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npx --yes @marp-team/marp-cli@4.4.0 --input-dir slides --output slides-dist --pdf --allow-local-files
      - name: Upload slides artifact
        if: steps.html.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slides
          path: slides-dist
          if-no-files-found: ignore

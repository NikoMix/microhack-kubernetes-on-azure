name: slides

on:
  push:
    branches: [main, nikomix-module-b-ttt-training]
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  pull_request:
    paths:
      - "slides/**"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slides-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marp:
    name: marp export
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Export slides to HTML
        id: html
        run: |
          set -euo pipefail
          if [ ! -d slides ]; then
            echo "slides/ not present yet — skipping."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(find slides -type f -name '*.md' | wc -l)"
          if [ "${count}" -eq 0 ]; then
            echo "No slide decks found — skipping."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p slides-dist
          npx --yes @marp-team/marp-cli@4.4.0 --input-dir slides --output slides-dist --html --allow-local-files
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Export slides to PDF (best-effort)
        if: steps.html.outputs.built == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npx --yes @marp-team/marp-cli@4.4.0 --input-dir slides --output slides-dist --pdf --allow-local-files
      - name: Upload slides artifact
        if: steps.html.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides
          path: slides-dist
          if-no-files-found: ignore

name: apps

on:
  push:
    branches: [main, nikomix-module-b-ttt-training]
    paths:
      - "apps/**"
      - "gitops/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "gitops/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet-api build + test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "10.0.x"
      - name: Build, lint and test
        run: |
          set -euo pipefail
          if [ ! -d apps/dotnet-api ]; then
            echo "apps/dotnet-api not present yet — skipping."
            exit 0
          fi
          dotnet restore apps/dotnet-api
          dotnet build apps/dotnet-api --no-restore -c Release
          dotnet format apps/dotnet-api --verify-no-changes --no-restore
          if find apps/dotnet-api -name '*Tests.csproj' | grep -q .; then
            dotnet test apps/dotnet-api --no-build -c Release --verbosity normal
          else
            echo "No test projects found — skipping dotnet test."
          fi

  python:
    name: python-worker lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install, lint and test
        run: |
          set -euo pipefail
          if [ ! -d apps/python-worker ]; then
            echo "apps/python-worker not present yet — skipping."
            exit 0
          fi
          cd apps/python-worker
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] && [ ! -f requirements.txt ]; then pip install .; fi
          pip install "ruff==0.15.20" "pytest>=8.3,<9"
          ruff check .
          ruff format --check .
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest -q
          else
            echo "No tests found — skipping pytest."
          fi

  node:
    name: node-web build + test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install, build, lint and test
        run: |
          set -euo pipefail
          if [ ! -d apps/node-web ]; then
            echo "apps/node-web not present yet — skipping."
            exit 0
          fi
          cd apps/node-web
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present
          npm run lint --if-present
          npm test --if-present

  kubeconform:
    name: kubeconform (gitops)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate manifests
        env:
          KUBECONFORM_VERSION: 0.8.0
        run: |
          set -euo pipefail
          if [ ! -d gitops ]; then
            echo "gitops not present yet — skipping."
            exit 0
          fi
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          curl -sSfL "${base}/kubeconform-linux-amd64.tar.gz" -o kubeconform-linux-amd64.tar.gz
          curl -sSfL "${base}/CHECKSUMS" -o CHECKSUMS
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          count="$(find gitops -type f \( -name '*.yaml' -o -name '*.yml' \) | wc -l)"
          if [ "${count}" -eq 0 ]; then
            echo "No manifests found — skipping."
            exit 0
          fi
          find gitops -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 -r ./kubeconform -ignore-missing-schemas -summary -schema-location default

  trivy:
    name: trivy fs scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
      - name: Trivy gate (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

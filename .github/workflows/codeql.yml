name: codeql

on:
  push:
    branches: [main, nikomix-module-b-ttt-training]
    paths:
      - "apps/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, nikomix-module-b-ttt-training]
    paths:
      - "apps/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has-langs: ${{ steps.set.outputs.has-langs }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine languages present
        id: set
        run: |
          set -euo pipefail
          langs=()
          if find apps -name '*.csproj' 2>/dev/null | grep -q .; then
            langs+=('{"language":"csharp","build-mode":"none"}')
          fi
          if find apps -name '*.py' 2>/dev/null | grep -q .; then
            langs+=('{"language":"python","build-mode":"none"}')
          fi
          if find apps \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) 2>/dev/null | grep -q .; then
            langs+=('{"language":"javascript-typescript","build-mode":"none"}')
          fi
          if [ "${#langs[@]}" -eq 0 ]; then
            echo "No supported source detected yet — CodeQL analysis will be skipped."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has-langs=false" >> "$GITHUB_OUTPUT"
          else
            joined="$(IFS=,; echo "${langs[*]}")"
            echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
            echo "has-langs=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: analyze (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.has-langs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          category: "/language:${{ matrix.language }}"

name: "Bug report"
description: "Report a defect in the MicroHack repository."
title: "[Bug] <short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Please give enough detail for a maintainer to reproduce it.
  - type: dropdown
    id: area
    attributes:
      label: "Affected area"
      description: "Which part of the repository is affected?"
      options:
        - "infra"
        - "apps"
        - "gitops"
        - "scripts"
        - "challenges"
        - "docs"
        - "slides"
        - ".github"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "List the exact steps that trigger the defect."
      placeholder: |
        1. Run scripts/deploy
        2. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behaviour"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behaviour"
      description: "What actually happened? Include logs or error output."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, tool versions, region, and any other relevant context."
      placeholder: "OS, az/kubectl versions, region (default westeurope)."
    validations:
      required: false
